[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-web-access"
version = "0.1.2"
description = "Safe, budget-aware web access for crawlers, AI agents, backend services, and ingestion pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Safe Web Access Team" }
]
keywords = ["web", "scraping", "crawler", "ssrf", "security", "httpx", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.24.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/mirza1272/safe-web-access"
Repository = "https://github.com/mirza1272/safe-web-access"
Documentation = "https://github.com/mirza1272/safe-web-access/blob/main/docs/README.md"
"Usage Guide" = "https://github.com/mirza1272/safe-web-access/blob/main/docs/USAGE.md"
"Security Guide" = "https://github.com/mirza1272/safe-web-access/blob/main/docs/SECURITY.md"
"Maintainer Guide" = "https://github.com/mirza1272/safe-web-access/blob/main/docs/HANDOVER.md"
Issues = "https://github.com/mirza1272/safe-web-access/issues"
Changelog = "https://github.com/mirza1272/safe-web-access/blob/main/CHANGELOG.md"
Security = "https://github.com/mirza1272/safe-web-access/security/advisories/new"
Releases = "https://github.com/mirza1272/safe-web-access/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safe_web_access"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/safe_web_access"]
