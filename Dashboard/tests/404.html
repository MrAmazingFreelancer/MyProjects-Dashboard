    :root {
      --bg: #111111;
      --text: #ffffff;
      --muted: #b8b8b8;
      --accent: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #1c1c1c 0%, var(--bg) 45%, #090909 100%);
      color: var(--text);
      font-family: Montserrat, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .notfound {
      max-width: 720px;
    }

    .code {
      margin: 0;
      font-size: clamp(92px, 24vw, 220px);
      font-weight: 900;
      letter-spacing: 8px;
      line-height: 0.9;
      color: transparent;
      -webkit-text-stroke: 2px var(--text);
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
      animation: rise 500ms ease-out;
    }

    .title {
      margin: 12px 0 8px;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: fade 700ms ease-out;
    }

    .message {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 16px;
      animation: fade 900ms ease-out;
    }

    .home-link {
      display: inline-block;
      text-decoration: none;
      color: #111111;
      background: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 12px 20px;
      border-radius: 999px;
      transition: transform 160ms ease, box-shadow 160ms ease;
      animation: fade 1100ms ease-out;
    }

    .home-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 209, 102, 0.35);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
</style>

<body>
  <main class="notfound" aria-labelledby="notfound-title">
    <h1 class="code">404</h1>
    <h2 class="title" id="notfound-title">Page Not Found</h2>
    <p class="message">The page you are looking for does not exist or has been moved.</p>
    <a class="home-link" href="/">Go to Homepage</a>
  </main>
</body>
