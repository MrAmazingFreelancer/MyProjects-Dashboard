<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
       "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <title>The page you were looking for doesn't exist (404)</title>
	<style type="text/css">
		body { background-color: #fff; color: #666; text-align: bottom; font-family: arial, sans-serif; }
		div.dialog {
			width: 25em;
			padding: 0 4em;
			margin: 4em auto 0 auto;
			border: 1px solid #ccc;
			border-right-color: #999;
			border-bottom-color: #999;
		}
		h4 { font-size: 100%; color: #f00; line-height: 1.5em; }
		    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    body {
      padding: 0;
      margin: 0;
    }

    #notfound {
      position: relative;
      height: 100vh;
      background: #030005;
    }

    #notfound .notfound {
      position: absolute;
      left: 50%;
      top: 50%;
      -webkit-transform: translate(-50%, -50%);
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .notfound {
      max-width: 767px;
      width: 100%;
      line-height: 1.4;
      text-align: center;
    }

    .notfound .notfound-404 {
      position: relative;
      height: 180px;
      margin-bottom: 20px;
      z-index: -1;
    }

    .notfound .notfound-404 h1 {
      font-family: 'Montserrat', sans-serif;
      position: absolute;
      left: 50%;
      top: 50%;
      -webkit-transform: translate(-50%, -50%);
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
      font-size: 224px;
      font-weight: 900;
      margin-top: 0;
      margin-bottom: 0;
      margin-left: -12px;
      color: #030005;
      text-transform: uppercase;
      text-shadow: -1px -1px 0 #8400ff, 1px 1px 0 #ff005a;
      letter-spacing: -20px;
    }

    .notfound .notfound-404 h2 {
      font-family: 'Montserrat', sans-serif;
      position: absolute;
      left: 0;
      right: 0;
      top: 110px;
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #8400ff;
      letter-spacing: 13px;
      margin: 0;
    }

    .notfound a {
      font-family: 'Montserrat', sans-serif;
      display: inline-block;
      text-transform: uppercase;
      color: #ff005a;
      text-decoration: none;
      border: 2px solid;
      background: transparent;
      padding: 10px 40px;
      font-size: 14px;
      font-weight: 700;
      -webkit-transition: 0.2s all;
      transition: 0.2s all;
    }

    .notfound a:hover {
      color: #8400ff;
    }

    @media only screen and (max-width: 767px) {
      .notfound .notfound-404 h2 {
        font-size: 24px;
      }
    }

    @media only screen and (max-width: 480px) {
      .notfound .notfound-404 h1 {
        font-size: 182px;
      }
    }
	</style>
</head>

<body>
  <!-- This file lives in public/404.html -->
  <div class="notfound">
  <div id="notfound">
      <div class="notfound-404">
   <h4>The page you were looking for doesn't exist.</h4>
    <p>You may have mistyped the address or the page may have moved.</p>
        <h1>404</h1>
        <h2>Page Not Found</h2
      <a href="/">Homepage</a>
    </div>
  </div>
</body>
</html>
